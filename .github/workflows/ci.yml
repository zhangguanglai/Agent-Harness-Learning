name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labs:
    name: labs + bench（16 个实验）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Static checks（编译 + 文档链接）
        run: |
          python -m compileall -q mini_harness runtime api orchestrator domain observability bench labs scripts
          python scripts/check_links.py

      - name: Run labs, demo and bench
        run: python labs/verify.py

  worker:
    name: dsh-worker（Node 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Worker protocol tests
        working-directory: spike/dsh-worker
        run: |
          node test/worker.test.js
          node test/spawn.test.js

  container:
    name: 容器镜像（无模型冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@v4

      - name: Build image with layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/s0-container/Dockerfile
          tags: banking-a/s0:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test（CLI / headless 入口 / MCP 包）
        run: python deploy/s0-container/verify.py --no-build --no-model --image banking-a/s0:ci
