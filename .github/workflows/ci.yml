name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labs:
    name: labs + bench（16 个实验）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run labs, demo and bench
        run: python labs/verify.py

  worker:
    name: dsh-worker（Node 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Worker protocol tests
        working-directory: spike/dsh-worker
        run: |
          node test/worker.test.js
          node test/spawn.test.js

  container:
    name: 容器镜像（无模型冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image and run smoke test
        run: python deploy/s0-container/verify.py --build --no-model
